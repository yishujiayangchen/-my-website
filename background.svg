<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice">

<defs>

  <!-- 夜空 -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070d"/>
    <stop offset=".32" stop-color="#0b1019"/>
    <stop offset=".65" stop-color="#151922"/>
    <stop offset="1" stop-color="#08090b"/>
  </linearGradient>

  <!-- 月光 -->
  <radialGradient id="moonGlow">
    <stop offset="0" stop-color="#fff6d7"/>
    <stop offset=".28" stop-color="#eadfbd" stop-opacity=".9"/>
    <stop offset=".7" stop-color="#c7b98f" stop-opacity=".25"/>
    <stop offset="1" stop-color="#c7b98f" stop-opacity="0"/>
  </radialGradient>

  <!-- 灯笼 -->
  <radialGradient id="lanternGlow">
    <stop offset="0" stop-color="#ffcc75" stop-opacity=".75"/>
    <stop offset=".35" stop-color="#d9853c" stop-opacity=".35"/>
    <stop offset="1" stop-color="#b86430" stop-opacity="0"/>
  </radialGradient>

  <!-- 城墙 -->
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#49413e"/>
    <stop offset=".45" stop-color="#29292c"/>
    <stop offset="1" stop-color="#101113"/>
  </linearGradient>

  <!-- 朱雀大街 -->
  <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#29282a"/>
    <stop offset=".55" stop-color="#171719"/>
    <stop offset="1" stop-color="#060708"/>
  </linearGradient>

  <!-- 酒楼 -->
  <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#272126"/>
    <stop offset="1" stop-color="#0c0d0f"/>
  </linearGradient>

  <!-- 雾 -->
  <filter id="mist">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <!-- 灯光柔化 -->
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

  <!-- 远景模糊 -->
  <filter id="farBlur">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

</defs>


