<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice">

    <defs>

        <!-- 天空渐变 -->
        <linearGradient id="sky"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">
            <stop offset="0%" stop-color="#090b0d"/>
            <stop offset="55%" stop-color="#171717"/>
            <stop offset="100%" stop-color="#29231d"/>
        </linearGradient>

        <!-- 月亮渐变 -->
        <radialGradient id="moon">
            <stop offset="0%" stop-color="#eee4c9"/>
            <stop offset="65%" stop-color="#d6c6a4"/>
            <stop offset="100%" stop-color="#9d8b6c"/>
        </radialGradient>

        <!-- 山体渐变 -->
        <linearGradient id="mountain"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">
            <stop offset="0%" stop-color="#34312c"/>
            <stop offset="100%" stop-color="#111211"/>
        </linearGradient>

        <!-- 水面 -->
        <linearGradient id="water"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">
            <stop offset="0%" stop-color="#262724"/>
            <stop offset="100%" stop-color="#090a09"/>
        </linearGradient>

        <filter id="blur">
            <feGaussianBlur stdDeviation="12"/>
        </filter>

    </defs>


    <!-- 天空 -->

    <rect width="1920"
          height="1080"
          fill="url(#sky)"/>


    <!-- 月光 -->

    <circle
        cx="1480"
        cy="230"
        r="115"
        fill="url(#moon)"
        opacity="0.9"/>

    <circle
        cx="1480"
        cy="230"
        r="170"
        fill="#d8caa8"
        opacity="0.08"
        filter="url(#blur)"/>


    <!-- 远山 -->

    <path
        d="
        M0 620
        L180 500
        L290 570
        L470 410
        L630 560
        L820 390
        L1000 550
        L1170 430
        L1320 560
        L1510 390
        L1700 540
        L1920 420
        L1920 800
        L0 800 Z"
        fill="#252622"
        opacity="0.75"/>


    <!-- 第二层山 -->

    <path
        d="
        M0 700
        L250 580
        L430 650
        L620 520
        L800 660
        L1050 540
        L1210 670
        L1420 530
        L1620 650
        L1810 540
        L1920 590
        L1920 850
        L0 850 Z"
        fill="url(#mountain)"/>


    <!-- 山间薄雾 -->

    <path
        d="
        M0 650
        C300 590 500 700 800 620
        C1100 540 1350 690 1920 600
        L1920 760
        L0 760 Z"
        fill="#b5aa91"
        opacity="0.07"
        filter="url(#blur)"/>


    <!-- 水面 -->

    <rect
        x="0"
        y="760"
        width="1920"
        height="320"
        fill="url(#water)"/>


    <!-- 水面倒影 -->

    <ellipse
        cx="1480"
        cy="820"
        rx="180"
        ry="35"
        fill="#c9bb98"
        opacity="0.07"
        filter="url(#blur)"/>


    <!-- 长安城墙 -->

    <path
        d="
        M0 710
        L260 710
        L260 680
        L450 680
        L450 700
        L690 700
        L690 665
        L900 665
        L900 700
        L1170 700
        L1170 675
        L1380 675
        L1380 705
        L1620 705
        L1620 680
        L1920 680
        L1920 820
        L0 820 Z"
        fill="#171817"/>


    <!-- 城门 -->

    <rect
        x="830"
        y="650"
        width="260"
        height="170"
        fill="#111211"/>

    <path
        d="
        M870 820
        L870 735
        Q960 640 1050 735
        L1050 820 Z"
        fill="#050606"/>


    <!-- 城楼主体 -->

    <rect
        x="865"
        y="580"
        width="190"
        height="80"
        fill="#171514"/>

    <!-- 城楼屋檐 -->

    <path
        d="
        M820 580
        L960 520
        L1100 580
        L1080 595
        L960 550
        L840 595 Z"
        fill="#0c0d0d"/>

    <path
        d="
        M850 550
        L960 490
        L1070 550
        L1050 560
        L960 520
        L870 560 Z"
        fill="#0a0b0b"/>


    <!-- 左侧楼阁 -->

    <g opacity="0.8">

        <rect
            x="350"
            y="620"
            width="100"
            height="130"
            fill="#111211"/>

        <path
            d="
            M320 620
            L400 570
            L480 620
            Z"
            fill="#090a0a"/>

        <path
            d="
            M335 585
            L400 545
            L465 585
            Z"
            fill="#090a0a"/>

    </g>


    <!-- 右侧楼阁 -->

    <g opacity="0.8">

        <rect
            x="1510"
            y="600"
            width="110"
            height="150"
            fill="#111211"/>

        <path
            d="
            M1475 600
            L1565 545
            L1655 600
            Z"
            fill="#090a0a"/>

        <path
            d="
            M1490 565
            L1565 520
            L1640 565
            Z"
            fill="#090a0a"/>

    </g>


    <!-- 城中灯火 -->

    <g fill="#c99d55">

        <circle cx="400" cy="655" r="5"/>
        <circle cx="530" cy="685" r="4"/>
        <circle cx="710" cy="690" r="5"/>
        <circle cx="1180" cy="690" r="5"/>
        <circle cx="1380" cy="700" r="4"/>
        <circle cx="1570" cy="635" r="5"/>
        <circle cx="1760" cy="690" r="4"/>

    </g>


    <!-- 前景树枝 -->

    <path
        d="
        M0 930
        C180 820 250 850 390 900
        C510 940 600 900 690 850"
        fill="none"
        stroke="#080908"
        stroke-width="18"
        opacity="0.9"/>

    <path
        d="
        M0 970
        C170 870 280 920 420 950"
        fill="none"
        stroke="#090a09"
        stroke-width="8"/>


    <!-- 暗角 -->

    <rect
        width="1920"
        height="1080"
        fill="#000"
        opacity="0.28"/>

</svg>